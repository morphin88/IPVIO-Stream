name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ipvio-stream-debug
          path: app/build/outputs/apk/debug/*.apk
      # Fork: the release build is the one to install (the debug build of a Compose app is much slower)
      - name: Signing key from repository secrets (optional)
        env:
          KS: ${{ secrets.FORK_KEYSTORE_B64 }}
          KSP: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > fork.jks
            printf 'storeFile=fork.jks\nstorePassword=%s\nkeyAlias=fork\nkeyPassword=%s\n' "$KSP" "$KSP" > keystore.properties
          fi
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ipvio-stream-bg-release
          path: app/build/outputs/apk/release/*.apk